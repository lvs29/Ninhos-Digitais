{% extends "base.html" %}
{% set e = especie or {} %}
{% block title %}{{ 'Nova espécie' if novo else 'Editar espécie' }} · Ninhos Digitais{% endblock %}

{% block content %}
<h1>{{ 'Cadastrar espécie' if novo else 'Editar espécie' }}</h1>

<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <p>
    <label>Nome comum<br>
      <input type="text" name="nome" value="{{ e.nome }}" required>
    </label>
  </p>
  <p>
    <label>Nome científico<br>
      <input type="text" name="nome_cientifico" value="{{ e.nome_cientifico }}" required>
    </label>
  </p>
  <p>
    <label>Distribuição geográfica<br>
      <textarea name="distribuicao_geografica" rows="4" cols="50" required>{{ e.distribuicao_geografica }}</textarea>
    </label>
  </p>
  <p>
    <label>
      <input type="checkbox" name="ameacada" {{ 'checked' if e.ameacada }}>
      Espécie ameaçada de extinção
    </label>
  </p>
  <button type="submit">Salvar</button>
  <a href="{{ url_for('admin.especies_lista') }}">Cancelar</a>
</form>
{% endblock %}
